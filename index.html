<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração Presidente 2026</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #66707a;
    --line: #e3e6ea; --bar-bg: #e9ecef; --lead: #1a7f37; --second: #8a5a00; --bar: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e8eaed; --muted: #9aa3ad;
            --line: #2a3139; --bar-bg: #2a3139; --lead: #3fb950; --second: #d29922; --bar: #58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .status { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .status .err { color: #d1242f; }
  select { font: inherit; padding: 4px 6px; margin-left: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .cand { display: grid; grid-template-columns: 2rem 1fr auto; gap: 4px 12px; align-items: center;
          padding: 10px 0; }
  .cand + .cand { border-top: 1px solid var(--line); }
  .pos { font-size: 1.4rem; font-weight: 700; color: var(--muted); }
  .nome { font-size: 1.25rem; font-weight: 700; }
  .partido { color: var(--muted); font-size: .85rem; }
  .pct { font-size: 1.8rem; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .votos { color: var(--muted); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; }
  .c1 .pct { color: var(--lead); } .c2 .pct { color: var(--second); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .total strong { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar); transition: width .6s; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  td.uf { width: 11rem; } td.uf small { color: var(--muted); }
  td.p { width: 4.5rem; text-align: right; font-weight: 600; }
  td.b { padding: 0 12px; }
  @media (max-width: 480px) { td.uf { width: 7.5rem; } .pct { font-size: 1.4rem; } .nome { font-size: 1.05rem; } }
</style>
</head>
<body>
<main>
  <h1>Apuração — Presidente 2026
    <select id="turno" aria-label="Turno">
      <option value="6258">2º turno</option>
      <option value="6257">1º turno</option>
    </select>
  </h1>
  <div class="status" id="status">Carregando…</div>

  <section class="card" id="candidatos"></section>

  <section class="card">
    <div class="total"><span>Urnas apuradas — Brasil</span><strong id="pctBr">–</strong></div>
    <div class="bar"><span id="barBr" style="width:0"></span></div>
    <div class="status" id="secoesBr" style="margin:6px 0 0"></div>
    <table><tbody id="estados"></tbody></table>
  </section>
</main>

<script>
  const BASE = "https://resultados.tse.jus.br/oficial/ele2026";
  const INTERVALO_MS = 60 * 1000;
  const UFS = { ac:"Acre", al:"Alagoas", ap:"Amapá", am:"Amazonas", ba:"Bahia", ce:"Ceará",
    df:"Distrito Federal", es:"Espírito Santo", go:"Goiás", ma:"Maranhão", mt:"Mato Grosso",
    ms:"Mato Grosso do Sul", mg:"Minas Gerais", pa:"Pará", pb:"Paraíba", pr:"Paraná",
    pe:"Pernambuco", pi:"Piauí", rj:"Rio de Janeiro", rn:"Rio Grande do Norte",
    rs:"Rio Grande do Sul", ro:"Rondônia", rr:"Roraima", sc:"Santa Catarina", sp:"São Paulo",
    se:"Sergipe", to:"Tocantins", zz:"Exterior" };

  const $ = id => document.getElementById(id);
  const num = s => Number(String(s).replace(/\./g, "").replace(",", "."));
  const fmtInt = n => Number(n).toLocaleString("pt-BR");
  const fmtPct = s => num(s).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  async function getJson(url) {
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status + " em " + url.split("/").pop());
    return r.json();
  }

  function candidatos(dados) {
    const cargo = dados.carg.find(c => c.cd === "1") || dados.carg[0];
    const lista = [];
    for (const agr of cargo.agr || [])
      for (const par of agr.par || [])
        for (const c of par.cand || [])
          lista.push({ nome: c.nmu || c.nm, partido: par.sg, votos: num(c.vap), pct: c.pvap });
    return lista.sort((a, b) => b.votos - a.votos);
  }

  function renderCandidatos(lista) {
    $("candidatos").innerHTML = lista.slice(0, 2).map((c, i) => `
      <div class="cand c${i + 1}">
        <div class="pos">${i + 1}º</div>
        <div><div class="nome">${esc(c.nome)}</div><div class="partido">${esc(c.partido)}</div></div>
        <div><div class="pct">${fmtPct(c.pct)}</div><div class="votos">${fmtInt(c.votos)} votos</div></div>
      </div>`).join("") || "<div class='status'>Sem candidatos ainda.</div>";
  }

  function renderEstados(abr) {
    const linhas = abr.filter(a => a.tpabr === "uf" || a.cdabr === "zz")
      .map(a => ({ uf: a.cdabr, pct: a.s.pst }))
      .sort((a, b) => (UFS[a.uf] || a.uf).localeCompare(UFS[b.uf] || b.uf, "pt-BR"));
    $("estados").innerHTML = linhas.map(l => `
      <tr>
        <td class="uf">${esc(UFS[l.uf] || l.uf.toUpperCase())} <small>${l.uf.toUpperCase()}</small></td>
        <td class="b"><div class="bar"><span style="width:${num(l.pct)}%"></span></div></td>
        <td class="p">${fmtPct(l.pct)}</td>
      </tr>`).join("");
  }

  let timer;
  async function atualizar() {
    const ele = $("turno").value;
    const e6 = "e" + ele.padStart(6, "0");
    try {
      const [br, ab] = await Promise.all([
        getJson(`${BASE}/${ele}/dados/br/br-c0001-${e6}-u.json`),
        getJson(`${BASE}/${ele}/dados/br/br-${e6}-ab.json`)
      ]);
      renderCandidatos(candidatos(br));
      $("pctBr").textContent = fmtPct(br.s.pst);
      $("barBr").style.width = num(br.s.pst) + "%";
      $("secoesBr").textContent = `${fmtInt(br.s.st)} de ${fmtInt(br.s.ts)} seções totalizadas`;
      renderEstados(ab.abr || []);
      $("status").innerHTML = `Dados TSE de ${esc(br.dg)} ${esc(br.hg)} · verificado às ${new Date().toLocaleTimeString("pt-BR")} · atualiza a cada minuto`;
    } catch (e) {
      $("status").innerHTML = `<span class="err">Falha ao atualizar (${esc(e.message)}). Nova tentativa em 1 minuto.</span>`;
    }
    clearTimeout(timer);
    timer = setTimeout(atualizar, INTERVALO_MS);
  }

  $("turno").addEventListener("change", atualizar);
  atualizar();
</script>
</body>
</html>
